name: Check servers and deploy status

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'servers.json'
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/status.yml'

permissions: {}

concurrency:
  group: server-status-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify monitor and dashboard logic
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/status-model.test.mjs
      - name: Check endpoints and prepare public files
        run: python3 scripts/monitor.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
