name: Verify Stato

on:
  push:
    paths:
      - 'servers.json'
      - 'site/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/status.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stato-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify monitor and dashboard logic
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/status-model.test.mjs
