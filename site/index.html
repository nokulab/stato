<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stato: endpoint availability from the monitoring runner.">
  <meta name="color-scheme" content="light">
  <title>Stato · Server status</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#servers">Skip to server status</a>
  <header class="toolbar">
    <div class="overview"><h1>Stato</h1><div><p id="summary" class="summary warning">Loading results…</p><p id="counts">Waiting for published checks</p></div></div>
    <div class="controls"><p id="published">No results loaded</p><button id="refresh" type="button">Refresh results</button><button id="fullscreen" type="button" hidden>Enter fullscreen</button></div>
    <p id="notice" class="notice" role="status" aria-live="polite">Loading published results…</p>
  </header>
  <main id="servers" class="servers" aria-label="Server status grid" tabindex="-1"></main>
  <noscript><p class="empty">Enable JavaScript to display published server results.</p></noscript>
  <footer>Checks reflect the runner’s location. Results refresh every 60 seconds; “Refresh results” does not run a new check. Times: Australia/Sydney.</footer>
</body>
</html>
